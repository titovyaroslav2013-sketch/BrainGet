
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090817">
<title>BrainGet — Brainrot Cases</title>
<style>
:root{--bg:#090817;--panel:#17152b;--line:#38315f;--cyan:#64edff;--pink:#ff75ce;--gold:#ffe28a;--text:#faf8ff;--muted:#b6b1d0}
*{box-sizing:border-box}
body{margin:0;padding:14px 12px 90px;background:radial-gradient(ellipse at top,#302052,transparent 48%),var(--bg);color:var(--text);font:15px system-ui,Arial,sans-serif}
main{max-width:760px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px;border:1px solid #544783;border-radius:20px;background:#17152bea}
.logo{font-size:32px;font-weight:1000;letter-spacing:-1px}.logo span{color:var(--cyan)}
.muted{color:var(--muted);font-size:13px}
.balance{white-space:nowrap;padding:10px;border-radius:12px;background:#0b0a19;color:var(--gold);font-weight:900}
h2{font-size:23px;margin:18px 0 10px}h3{margin:0 0 7px}
p{color:#cbc6e5;line-height:1.5}
.panel,.case{padding:15px;margin:12px 0;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#211c3b,#111323)}
.hero{background:linear-gradient(120deg,#48215a,#152c4c);border-color:#9162bc}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.art{display:grid;place-items:center;height:90px;border-radius:14px;background:radial-gradient(circle,#6551a755,transparent 72%);font-size:55px}
.price{margin:10px 0;color:var(--gold);font-weight:900}
.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#343052;font-size:11px}
button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:linear-gradient(100deg,var(--cyan),#a4b5ff);color:#111024;font-weight:900;cursor:pointer}
button.purple{background:linear-gradient(100deg,#b28aff,var(--pink))}
button.secondary{background:#292644;color:white;border:1px solid #4a426f}
button:disabled{opacity:.45;cursor:not-allowed}
.reward{display:flex;align-items:center;gap:10px;padding:11px;margin:8px 0;border-radius:14px;background:#0c0b1b;border:1px solid #393154}
.emoji{font-size:34px}.info{flex:1;min-width:0}.rarity{font-size:12px;color:var(--cyan)}
#message{min-height:24px;text-align:center;color:#8fffc0;font-weight:800;margin:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:5px;justify-content:center;padding:8px 5px;background:#090817f5;border-top:1px solid #383154;backdrop-filter:blur(10px)}
nav button{max-width:180px;flex:1;margin:0;padding:11px 3px;background:#24203e;color:white;font-size:12px}
nav button.active{background:var(--cyan);color:#111}
.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:#05040df5;backdrop-filter:blur(12px)}
.open-card{width:min(100%,360px);padding:25px 18px;text-align:center;border:1px solid #9d76ff;border-radius:24px;background:linear-gradient(145deg,#302050,#101326);box-shadow:0 0 40px #a16bff44}
.open-icon{font-size:82px;animation:shake .35s infinite alternate}
.reveal{animation:reveal .65s ease-out}
.og{color:#ffb5df;text-shadow:0 0 12px #ff4cb8,0 0 30px #ff4cb8}
@keyframes shake{to{transform:rotate(10deg) scale(1.08)}}
@keyframes reveal{from{opacity:0;transform:scale(.2) rotate(-15deg)}to{opacity:1;transform:scale(1)}}
@media(max-width:420px){header{padding:12px}.logo{font-size:27px}.case{padding:10px}.grid{gap:7px}nav button{font-size:10px}}
</style>
</head>
<body>
<main>
<header>
 <div><div class="logo"><span>Brain</span>Get</div><div class="muted">STEAL A BRAINROT CASES</div><div id="profile" class="muted">Гость · локальная игра</div></div>
 <div class="balance">🪙 <span id="coins">500</span></div>
</header>
<div id="app"></div>
<div id="message"></div>
</main>
<nav>
<button id="nav-home" onclick="go('home')">🏠 Главная</button>
<button id="nav-cases" onclick="go('cases')">📦 Кейсы</button>
<button id="nav-daily" onclick="go('daily')">🎁 Daily</button>
<button id="nav-inventory" onclick="go('inventory')">🎒 Инвентарь</button>
</nav>
<script>
const SAVE_KEY='brainget-steal-a-brainrot-v1';
const DAY=24*60*60*1000;
const initial={coins:500,inventory:[],dailyClaimAt:0};
let data;
try{data={...initial,...JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}}catch(e){data={...initial}}
if(!Array.isArray(data.inventory))data.inventory=[];
let page='home',timer=null;

/* Персонажи из Steal a Brainrot.
   Названия и редкости могут зависеть от обновлений игры. */
const characters=[
{name:'Noobini Pizzanini',emoji:'🍕',rarity:'Обычный',value:50,weight:30},
{name:'Lirilì Larilà',emoji:'🐘',rarity:'Обычный',value:60,weight:27},
{name:'Tim Cheese',emoji:'🧀',rarity:'Обычный',value:70,weight:25},
{name:'Fluriflura',emoji:'🌺',rarity:'Обычный',value:80,weight:23},
{name:'Talpa Di Ferro',emoji:'🦡',rarity:'Обычный',value:90,weight:21},
{name:'Svinina Bombardino',emoji:'🐷',rarity:'Обычный',value:100,weight:19},
{name:'Trippi Troppi',emoji:'🦐',rarity:'Редкий',value:120,weight:17},
{name:'Tung Tung Tung Sahur',emoji:'🥁',rarity:'Редкий',value:150,weight:15},
{name:'Gangster Footera',emoji:'🦶',rarity:'Редкий',value:180,weight:14},
{name:'Bandito Bobritto',emoji:'🦫',rarity:'Редкий',value:200,weight:13},
{name:'Boneca Ambalabu',emoji:'🐸',rarity:'Эпический',value:250,weight:12},
{name:'Cappuccino Assassino',emoji:'☕',rarity:'Эпический',value:300,weight:11},
{name:'Tralalero Tralala',emoji:'🦈',rarity:'Легендарный',value:400,weight:10},
{name:'Bombardiro Crocodilo',emoji:'🐊',rarity:'Легендарный',value:500,weight:9},
{name:'Brr Brr Patapim',emoji:'🌳',rarity:'Легендарный',value:650,weight:8},
{name:'Chimpanzini Bananini',emoji:'🍌',rarity:'Легендарный',value:750,weight:7},
{name:'Bombombini Gusini',emoji:'🪿',rarity:'Легендарный',value:900,weight:6},
{name:'Cocofanto Elefanto',emoji:'🐘',rarity:'Легендарный',value:1100,weight:5},
{name:'La Vaca Saturno Saturnita',emoji:'🐄',rarity:'Секретный',value:2500,weight:4},
{name:'Los Tralaleritos',emoji:'🦈',rarity:'Секретный',value:3500,weight:3},
{name:'Las Tralaleritas',emoji:'🦈',rarity:'Секретный',value:4000,weight:3},
{name:'Graipuss Medussi',emoji:'🪼',rarity:'Секретный',value:5000,weight:2},
{name:'Trenostruzzo Turbo 3000',emoji:'🦤',rarity:'Секретный',value:6000,weight:2},
{name:'Odin Din Din Dun',emoji:'⚡',rarity:'Секретный',value:7500,weight:2},
{name:'Tralalero Tralala (инф.)',emoji:'🦈',rarity:'Секретный',value:8000,weight:1},
{name:'Strawberry Elephant',emoji:'🍓🐘',rarity:'OG',value:1000000,weight:1}
];
const OG={name:'Strawberry Elephant',emoji:'🍓🐘',rarity:'OG',value:1000000,weight:1};
const caseList=[
{name:'STARTER BOX',emoji:'📦',desc:'Начни коллекцию',price:25,rarities:['Обычный','Редкий']},
{name:'GOLDEN CHAOS',emoji:'🌟',desc:'Редкие и эпические',price:100,rarities:['Редкий','Эпический','Легендарный']},
{name:'SECRET VAULT',emoji:'🔮',desc:'Охота за секретками',price:500,rarities:['Секретный']},
{name:'GOD OF BRAINROT',emoji:'👑',desc:'Легендарные и секретные',price:2500,rarities:['Легендарный','Секретный']},
{name:'OG CASE',emoji:'🍓🐘',desc:'Эксклюзивный Strawberry Elephant',price:10000,og:true}
];

function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(data));document.getElementById('coins').textContent=data.coins}
function say(s){document.getElementById('message').textContent=s}
function go(p){page=p;say('');render()}
function remaining(){return Math.max(0,DAY-(Date.now()-Number(data.dailyClaimAt||0)))}
function clock(ms){let s=Math.ceil(ms/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function pick(pool){let total=pool.reduce((s,x)=>s+x.weight,0),n=Math.random()*total;for(const x of pool){n-=x.weight;if(n<=0)return {...x}}return {...pool[0]}}
function card(c){return `<section class="case"><div class="art">${c.emoji}</div><span class="pill">${c.og?'EXCLUSIVE OG':'BRAINROT CASE'}</span><h3>${c.name}</h3><p class="muted">${c.desc}</p><div class="price">${c.price.toLocaleString('ru-RU')} 🪙</div><button class="${c.og?'purple':''}" onclick="openCase('${c.name}')">Открыть кейс</button></section>`}
function render(){
 save();document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+page)?.classList.add('active');
 if(timer){clearInterval(timer);timer=null}
 const app=document.getElementById('app');
 if(page==='home')app.innerHTML=`<section class="panel hero"><span class="pill">🧠 BRAINROT UNIVERSE</span><h2>Добро пожаловать в BrainGet!</h2><p>Открывай кейсы, собирай персонажей из Steal a Brainrot и охоться за секретками.</p><button class="purple" onclick="go('daily')">🎁 Забрать ежедневный кейс</button></section><div class="grid">${card(caseList[0])}${card(caseList[1])}</div><section class="panel"><h3>🎒 Твоя коллекция</h3><p>Персонажей: ${data.inventory.length}</p><button class="secondary" onclick="go('inventory')">Открыть инвентарь</button></section>`;
 if(page==='cases')app.innerHTML=`<h2>🎁 Магазин кейсов</h2><p>Выбирай кейс. OG CASE выдаёт Strawberry Elephant.</p><div class="grid">${caseList.map(card).join('')}</div>`;
 if(page==='daily'){
 const l=remaining(),ready=l===0;
 app.innerHTML=`<section class="panel hero"><div class="art">🎁✨</div><span class="pill">FREE REWARD</span><h2>Ежедневный кейс</h2><p>Бесплатный кейс каждые 24 часа. Забери персонажа для своей коллекции!</p><div class="price" id="dailyTimer">${ready?'Кейс готов!':'До следующего: '+clock(l)}</div><button id="dailyBtn" class="purple" ${ready?'':'disabled'} onclick="claimDaily()">🎁 ${ready?'Открыть кейс':'Уже получен'}</button><p class="muted">Таймер хранится локально и может быть сброшен очисткой данных браузера.</p></section>`;
 timer=setInterval(()=>{if(page!=='daily'){clearInterval(timer);timer=null;return}const left=remaining(),t=document.getElementById('dailyTimer'),b=document.getElementById('dailyBtn');if(t)t.textContent=left===0?'Кейс готов!':'До следующего: '+clock(left);if(b){b.disabled=left>0;b.textContent=left===0?'🎁 Открыть кейс':'Уже получен'}},1000);
 }
 if(page==='inventory')app.innerHTML=`<h2>🎒 Инвентарь</h2><section class="panel"><h3>${data.inventory.length} персонажей</h3><p>Монеты: ${data.coins} 🪙</p></section>${data.inventory.length?data.inventory.map((x,i)=>`<div class="reward"><div class="emoji">${x.emoji}</div><div class="info"><b>${x.name}</b><div class="rarity">${x.rarity}</div><div class="muted">Стоимость: ${x.value.toLocaleString('ru-RU')} 🪙</div></div><button class="secondary" style="width:auto" onclick="sell(${i})">Продать</button></div>`).join(''):'<section class="panel"><p>Пока пусто. Открой первый кейс!</p><button onclick="go(\\'cases\\')">К кейсам</button></section>'}`;
}
function animateReward(x,title){
 const overlay=document.createElement('div');overlay.className='overlay';
 overlay.innerHTML=`<div class="open-card"><div class="open-icon">📦</div><h2>${title}</h2><p>Открываем...</p></div>`;
 document.body.appendChild(overlay);
 setTimeout(()=>{
 overlay.innerHTML=`<div class="open-card reveal"><div class="open-icon">${x.emoji}</div><h2 class="${x.rarity==='OG'?'og':''}">${x.name}</h2><span class="pill">${x.rarity}</span><p>Добавлен в инвентарь!</p><button id="collect">Забрать</button></div>`;
 document.getElementById('collect').onclick=()=>{overlay.remove();go('inventory');say('🎉 Получен '+x.name+'!')};
 },1800);
}
function openCase(name){
 const c=caseList.find(x=>x.name===name);if(!c)return;
 if(data.coins<c.price){say('❌ Не хватает монет!');return}
 data.coins-=c.price;let x;
 if(c.og)x={...OG};
 else{let pool=characters.filter(x=>c.rarities.includes(x.rarity)&&x.rarity!=='OG');if(!pool.length)pool=characters.filter(x=>x.rarity!=='OG');x=pick(pool)}
 data.inventory.push(x);save();render();animateReward(x,c.name);
}
function claimDaily(){
 if(remaining()>0){say('⏳ Кейс ещё не готов');return}
 const pool=characters.filter(x=>x.rarity!=='OG');
 const x=pick(pool);data.dailyClaimAt=Date.now();data.inventory.push(x);save();render();animateReward(x,'DAILY CASE');
}
function sell(i){const x=data.inventory[i];if(!x)return;if(x.rarity==='OG'){say('👑 OG нельзя продать!');return}data.inventory.splice(i,1);const amount=Math.floor(x.value/2);data.coins+=amount;save();render();say('Продано за '+amount+' монет')}
render();

/* Telegram Mini App: серверная проверка initData. */
const tgScript=document.createElement('script');
tgScript.src='https://telegram.org/js/telegram-web-app.js';
tgScript.onload=async()=>{
 const tg=window.Telegram?.WebApp;if(!tg?.initData)return;
 tg.ready();tg.expand();
 try{
  const res=await fetch('https://ovehdiobiujiplgetfsw.supabase.co/functions/v1/quick-proccesor',{
   method:'POST',
   headers:{'Content-Type':'application/json','apikey':'sb_publishable_Aneu-ATnBGoVrMZVDgmGvw_ZsOnMKhO'},
   body:JSON.stringify({initData:tg.initData})
  });
  const result=await res.json();
  if(res.ok&&result.verified){document.getElementById('profile').textContent='Telegram: '+(result.user.first_name||result.user.username||result.user.id);console.log('BrainGet Telegram verified',result.user)}
  else{document.getElementById('profile').textContent='Гость · Telegram не подтверждён';console.error('BrainGet Telegram error',result)}
 }catch(e){document.getElementById('profile').textContent='Гость · ошибка соединения';console.error(e)}
};
document.head.appendChild(tgScript);
</script>
</body>
</html>
