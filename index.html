
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainGet</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px 12px 100px;font-family:Arial,sans-serif;
 color:white;background:linear-gradient(140deg,#07152e,#123d77,#090d19);
 min-height:100vh
}
main{max-width:480px;margin:auto}
header,.card{
 background:#101d38;border:1px solid #315b91;
 border-radius:18px;padding:18px;margin-bottom:14px
}
header{text-align:center;border:2px solid #16cfff;box-shadow:0 0 24px #168bff44}
h1{font-size:38px;margin:0}
h1 span{color:#21d5ff}
p{color:#c0d5f5;line-height:1.5}
h2{font-size:23px}
h3{margin-top:0}
button,select,input{
 width:100%;padding:13px;border:0;border-radius:11px;font-size:15px
}
button{
 background:#19caff;color:#07152e;font-weight:bold;cursor:pointer;margin-top:7px
}
button:active{transform:scale(.98)}
button.secondary{background:#243e66;color:white}
button:disabled{opacity:.45}
input,select{background:#0b1930;color:white;border:1px solid #315b91}
nav{
 position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;
 gap:4px;background:#081326f5;padding:9px 4px;
 border-top:1px solid #315b91;z-index:10
}
nav button{flex:1;max-width:100px;min-width:0;padding:10px 2px;
 margin:0;font-size:11px;background:#172b49;color:white}
nav button.active{background:#19caff;color:#07152e}
.item{border:1px solid #315b91;border-radius:12px;padding:12px;
 margin:8px 0;background:#0b1930}
.small{font-size:12px;color:#8fb5e9}
#message{text-align:center;font-weight:bold;overflow-wrap:anywhere}
.notice{border:1px solid #c18b34;background:#382b14;padding:12px;
 border-radius:12px;color:#ffe2a0;font-size:13px;line-height:1.5}
.stat{display:flex;justify-content:space-between;gap:8px}
</style>
</head>
<body>
<main>
<header>
 <h1><span>Brain</span>Get</h1>
 <p>🧠 Твоя вселенная Brainrot!</p>
 <strong>⭐ Монеты: <span id="coins">500</span></strong>
</header>
<div id="app"></div>
<p id="message" aria-live="polite"></p>
</main>

<nav>
 <button onclick="go('home')" id="nav-home">🏠 Главная</button>
 <button onclick="go('cases')" id="nav-cases">🎁 Кейсы</button>
 <button onclick="go('upgrade')" id="nav-upgrade">⚡ Апгрейд</button>
 <button onclick="go('inventory')" id="nav-inventory">🎒 Инвентарь</button>
 <button onclick="go('wallet')" id="nav-wallet">💰 Кошелёк</button>
</nav>

<script>
const initial = {coins:500, inventory:[], history:[]};
let data;
try {
 const stored = JSON.parse(localStorage.getItem('brainget-save'));
 data = stored && typeof stored === 'object'
   ? {...initial,...stored,
      coins:Math.max(0,Number(stored.coins)||0),
      inventory:Array.isArray(stored.inventory)?stored.inventory:[],
      history:Array.isArray(stored.history)?stored.history:[]}
   : {...initial,inventory:[],history:[]};
} catch(e) {
 data = {...initial,inventory:[],history:[]};
}

let page = 'home';
const rewards = [
 {name:'Noobini Pizzanini',rarity:'Обычный',value:50,emoji:'🍕'},
 {name:'Tralalero Tralala',rarity:'Редкий',value:120,emoji:'🦈'},
 {name:'Tung Tung Tung Sahur',rarity:'Эпический',value:250,emoji:'🥁'},
 {name:'Brr Brr Patapim',rarity:'Легендарный',value:500,emoji:'🌳'},
 {name:'Brainrot God',rarity:'Мифический',value:1000,emoji:'👑'}
];

function save(){
 try {
  localStorage.setItem('brainget-save',JSON.stringify(data));
 } catch(e) {
  say('⚠️ Не удалось сохранить данные в браузере.');
 }
 document.getElementById('coins').textContent=data.coins;
}

function log(text){
 data.history.unshift({text,time:new Date().toLocaleString('ru-RU')});
 data.history=data.history.slice(0,30);
}

function go(name){
 page=name;
 document.getElementById('message').textContent='';
 render();
}

function say(text){
 document.getElementById('message').textContent=text;
}

function render(){
 save();
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 const nav=document.getElementById('nav-'+page);
 if(nav)nav.classList.add('active');

 const app=document.getElementById('app');

 if(page==='home'){
  app.innerHTML=`
   <h2>🔥 Игровые разделы</h2>
   <div class="card"><h3>🎁 Кейсы</h3><p>Открывай кейсы и получай персонажей!</p><button onclick="go('cases')">Открыть кейсы</button></div>
   <div class="card"><h3>⚡ Апгрейд</h3><p>Пробуй улучшать персонажей за виртуальные монеты.</p><button onclick="go('upgrade')">Перейти к апгрейду</button></div>
   <div class="card"><h3>🎒 Инвентарь</h3><p>Собирай свою коллекцию Brainrot.</p><button onclick="go('inventory')">Моя коллекция</button></div>
   <div class="card"><h3>🧠 Brainrot</h3><p>Исследуй мир мемных персонажей!</p><button onclick="go('brainrot')">Исследовать</button></div>
   <div class="card"><h3>🍀 Lucky Blocks</h3><p>Бесплатный игровой бонус.</p><button onclick="go('lucky')">Открыть</button></div>
   <div class="card"><h3>💰 Кошелёк</h3><p>Баланс и история игровых операций.</p><button onclick="go('wallet')">Открыть кошелёк</button></div>`;
 }

 if(page==='cases'){
  app.innerHTML=`<h2>🎁 Кейсы</h2>
   <div class="card"><h3>📦 Базовый кейс</h3><p>Цена: 100 виртуальных монет</p><button onclick="openCase(100)">Открыть за 100 🪙</button></div>
   <div class="card"><h3>💎 Премиум-кейс</h3><p>Цена: 250 виртуальных монет</p><button onclick="openCase(250)">Открыть за 250 🪙</button></div>`;
 }

 if(page==='inventory'){
  app.innerHTML=`<h2>🎒 Инвентарь</h2><p>Твои персонажи: ${data.inventory.length}</p>`+
   (data.inventory.length?data.inventory.map((x,i)=>
    `<div class="item">${x.emoji} <strong>${x.name}</strong><p>${x.rarity} · Цена: ${x.value} 🪙</p><button class="secondary" onclick="sell(${i})">Продать за ${Math.floor(x.value/2)} 🪙</button></div>`
   ).join(''):'<div class="card"><p>Пока пусто! Открой первый кейс 🎁</p><button onclick="go(\'cases\')">К кейсам</button></div>');
 }

 if(page==='upgrade'){
  app.innerHTML=`<h2>⚡ Апгрейд</h2><div class="card"><p>Стоимость попытки — 50 виртуальных монет. Шанс успеха — 50%.</p>`+
   (data.inventory.length?
    `<select id="upgradeItem">`+data.inventory.map((x,i)=>`<option value="${i}">${x.emoji} ${x.name} (${x.rarity})</option>`).join('')+`</select><button onclick="upgrade()">Попробовать улучшить</button>`:
    `<p>Сначала получи персонажа из кейса!</p><button onclick="go('cases')">К кейсам</button>`)+`</div>`;
 }

 if(page==='brainrot'){
  app.innerHTML=`<h2>🧠 Brainrot</h2><div class="card"><p>Коллекционируй мемных персонажей!</p><button onclick="go('cases')">Получить персонажа</button></div>`;
 }

 if(page==='lucky'){
  app.innerHTML=`<h2>🍀 Lucky Blocks</h2><div class="card"><p>Бесплатная игровая награда в виртуальных монетах.</p><button onclick="lucky()">Открыть блок 🎁</button></div>`;
 }

 if(page==='games'){
  app.innerHTML=`<h2>🎮 Игры</h2><div class="card"><h3>🧠 Коллекционер</h3><p>Собери больше персонажей.</p><button onclick="go('inventory')">Моя коллекция</button></div><div class="card"><h3>⚡ Испытание апгрейда</h3><p>Попробуй улучшить персонажа.</p><button onclick="go('upgrade')">Начать</button></div>`;
 }

 if(page==='wallet'){
  app.innerHTML=`
   <h2>💰 Кошелёк BrainGet</h2>
   <div class="card">
    <p class="small">ТВОЙ ИГРОВОЙ БАЛАНС</p>
    <h2>🪙 ${data.coins} монет</h2>
    <div class="notice">ДЕМО-РЕЖИМ: кнопки ниже работают только с виртуальными монетами. Реальные деньги не принимаются и не переводятся. Баланс хранится в браузере и не защищён от изменения.</div>
   </div>
   <div class="card">
    <h3>➕ Пополнение (демо)</h3>
    <p>Добавляет тестовые монеты для проверки интерфейса.</p>
    <button onclick="topUpDemo(100)">+100 виртуальных монет</button>
    <button onclick="topUpDemo(500)">+500 виртуальных монет</button>
    <button onclick="topUpDemo(1000)">+1000 виртуальных монет</button>
   </div>
   <div class="card">
    <h3>🏦 Вывод (демо)</h3>
    <p>Проверка вида заявки на вывод виртуальных монет. Реального вывода нет.</p>
    <label for="withdrawAmount">Количество монет</label>
    <select id="withdrawAmount">
     <option value="100">100 монет</option>
     <option value="250">250 монет</option>
     <option value="500">500 монет</option>
    </select>
    <button onclick="requestWithdraw()">Создать тестовую заявку</button>
   </div>
   <div class="card">
    <h3>📜 История операций</h3>
    ${data.history.length?data.history.map(x=>`<div class="item"><strong>${x.text}</strong><p class="small">${x.time}</p></div>`).join(''):'<p>Операций пока нет.</p>'}
   </div>`;
 }
}

function openCase(price){
 if(data.coins<price)return say('❌ Недостаточно монет!');
 data.coins-=price;
 const pool=price===250?rewards.slice(1):rewards.slice(0,4);
 const reward={...pool[Math.floor(Math.random()*pool.length)]};
 data.inventory.push(reward);
 log('🎁 Кейс: −'+price+' монет, получен '+reward.name);
 render();
 say('🎉 Получен персонаж: '+reward.name+'!');
}

function sell(i){
 if(!Number.isInteger(i)||!data.inventory[i])return;
 const item=data.inventory.splice(i,1)[0];
 const amount=Math.floor(item.value/2);
 data.coins+=amount;
 log('🎒 Продажа '+item.name+': +'+amount+' монет');
 render();
 say('Продано! +'+amount+' монет.');
}

function upgrade(){
 const select=document.getElementById('upgradeItem');
 if(!select)return;
 if(data.coins<50)return say('❌ Нужно 50 монет!');
 const i=Number(select.value);
 if(!Number.isInteger(i)||!data.inventory[i])return say('Выбери персонажа.');
 data.coins-=50;
 let result;
 if(Math.random()<0.5){
  const item=data.inventory[i];
  const next=rewards.findIndex(x=>x.rarity===item.rarity);
  if(next>=0&&next<rewards.length-1){
   data.inventory[i]={...rewards[next+1]};
   result='🔥 Успех! Новый персонаж: '+data.inventory[i].name;
  }else{
   data.coins+=100;
   result='👑 Максимальный уровень! Бонус +100 монет.';
  }
 }else{
  result='😅 Улучшение не удалось.';
 }
 log('⚡ Апгрейд: −50 монет');
 save();
 render();
 say(result);
}

function lucky(){
 const amount=Math.floor(Math.random()*101)+25;
 data.coins+=amount;
 log('🍀 Lucky Block: +'+amount+' монет');
 save();
 say('🍀 Ты получил '+amount+' виртуальных монет!');
}

function topUpDemo(amount){
 data.coins+=amount;
 log('🧪 ДЕМО-пополнение: +'+amount+' виртуальных монет');
 render();
 say('🪙 Добавлено '+amount+' тестовых монет. Реальный платёж не выполнялся.');
}

function requestWithdraw(){
 const field=document.getElementById('withdrawAmount');
 if(!field)return;
 const amount=Number(field.value);
 if(![100,250,500].includes(amount))return say('❌ Неверная сумма.');
 if(data.coins<amount)return say('❌ Недостаточно виртуальных монет.');
 data.coins-=amount;
 log('🧪 ДЕМО-заявка на вывод '+amount+' виртуальных монет — не денежный перевод');
 render();
 say('✅ Тестовая заявка создана. Реальный вывод денег не выполнялся.');
}

render();
</script>
</body>
</html>
